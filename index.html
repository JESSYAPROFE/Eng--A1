<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English with Teacher Jessy</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5FF;--card:#fff;--ink:#14213D;--mute:#5B6785;--pri:#2D5BFF;--on:#fff;--ok:#12805A;--okBg:#DDF6EA;--bad:#C93238;--badBg:#FDE4E5;--gold:#FFB400;--line:#D6DEF5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1530;--card:#19213F;--ink:#EEF2FF;--mute:#9AA6CC;--pri:#6C8CFF;--on:#0F1530;--ok:#3DD598;--okBg:#12392D;--bad:#FF8D91;--badBg:#43202A;--gold:#FFC53D;--line:#2B3560}}
:root[data-theme="dark"]{--bg:#0F1530;--card:#19213F;--ink:#EEF2FF;--mute:#9AA6CC;--pri:#6C8CFF;--on:#0F1530;--ok:#3DD598;--okBg:#12392D;--bad:#FF8D91;--badBg:#43202A;--gold:#FFC53D;--line:#2B3560}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;font-size:17px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 150px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1{font-size:28px;font-weight:900;margin:0}
h2{font-size:22px;font-weight:800;margin:24px 0 8px;line-height:1.25}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:4px 12px;font-weight:800;margin-left:6px;white-space:nowrap}
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}
.cheat div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:19px}
.cheat b{color:var(--pri);font-weight:900}
.lead{color:var(--mute);margin:0 0 12px}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:14px;margin-bottom:12px}
.lesson:active{transform:translateY(2px);border-bottom-width:3px}
.lesson.locked,.tab:disabled{opacity:.55;cursor:not-allowed}
.lesson.done .badge{background:var(--ok);color:var(--on)}
.lesson:disabled:active{transform:none;border-bottom-width:5px}
.badge{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;font-weight:900;font-size:20px}
.lesson b{display:block;font-size:19px;font-weight:800}
.lesson small{color:var(--mute);font-size:15px;font-weight:600}
.lesson .go{margin-left:auto;color:var(--pri);font-weight:800}
.bar{display:flex;align-items:center;gap:12px}
.x{background:none;border:0;font-size:26px;color:var(--mute);padding:4px 8px}
.track{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.sent{font-size:26px;font-weight:800;margin:0 0 18px}
.sent.read{font-size:17px;font-weight:600;line-height:1.55;white-space:pre-line;margin:0 0 16px}
.sent.read.sm{font-size:15px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt,.w{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 16px;font-weight:800;font-size:19px}
.opt{text-align:left}
.opt.sel,.w.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,var(--card))}
.opt.right{border-color:var(--ok);background:var(--okBg)}
.opt.wrong{border-color:var(--bad);background:var(--badBg)}
.tray{min-height:70px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin-bottom:22px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.w.ghost{display:inline-block;background:var(--line);border-color:transparent;color:transparent;user-select:none}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.foot.ok{background:var(--okBg);border-color:var(--ok)}
.foot.bad{background:var(--badBg);border-color:var(--bad)}
.in{max-width:560px;margin:0 auto}
.msg{font-weight:900;font-size:20px;margin-bottom:10px}
.ok .msg{color:var(--ok)}.bad .msg{color:var(--bad)}
.msg small{display:block;font-weight:700;font-size:16px;color:var(--ink)}
.cta{width:100%;background:var(--pri);color:var(--on);border:0;border-bottom:5px solid color-mix(in srgb,var(--pri) 70%,#000);border-radius:14px;padding:14px;font-weight:900;font-size:19px}
.cta:disabled{background:var(--line);border-bottom-color:var(--line);color:var(--mute);cursor:not-allowed}
.alt{background:none;color:var(--pri);border:0;font-weight:800;padding:14px;width:100%;margin-top:6px}
.end{text-align:center;padding-top:50px}
.end .big{font-size:64px}
.end p{font-size:20px;margin:6px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0 0;padding-bottom:4px}
.tab{flex:none;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 16px;font-weight:800}
.tab.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
.tab.link{font:inherit;color:inherit;text-decoration:none;display:inline-block;text-align:center}
.at{margin:18px 0 10px}
.nm{width:100%;font:inherit;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.share{display:block;text-align:center;text-decoration:none;margin-top:18px}
.pic{font-size:88px;line-height:1.1;text-align:center;margin:6px 0 14px}
.aud{display:flex;gap:10px;margin:0 0 18px}
.play{flex:1;background:var(--pri);color:var(--on);border:0;border-bottom:5px solid color-mix(in srgb,var(--pri) 70%,#000);border-radius:14px;padding:14px;font-weight:900;font-size:18px}
.ty{font-size:22px;margin-top:4px}
.mic{width:100%;background:var(--pri);color:var(--on);border:0;border-bottom:5px solid color-mix(in srgb,var(--pri) 70%,#000);border-radius:14px;padding:18px;font-weight:900;font-size:20px;margin-top:12px}
.mic.on{background:#E53935;border-bottom-color:#9b1c1c;color:#fff}
.mic:disabled{opacity:.6}
.heard{margin:12px 0 0;font-size:16px;font-weight:700;line-height:1.4}
.hero{display:flex;align-items:center;gap:14px}
.hero img{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--pri);flex:none;background:var(--card)}
.hero small{display:block;color:var(--mute);font-weight:800;font-size:16px}
.hero h1{line-height:1.1}
.stats{margin:14px 0 0}
.stats .chip{margin:0 8px 0 0}
.warn{background:var(--badBg);color:var(--ink);border:2px solid var(--bad);border-radius:12px;padding:10px 12px;font-size:15px;margin:14px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row small{display:block;color:var(--mute);font-weight:600;font-size:14px}
.ok2{color:var(--ok);font-weight:900;white-space:nowrap}
.code{width:100%;min-height:72px;font:13px/1.3 ui-monospace,monospace;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px;margin-top:8px}
.msgbox{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;text-align:left;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.foot.ok,.foot.bad{animation:up .25s ease-out}@keyframes up{from{transform:translateY(100%)}}}
</style>
</head>

  try{const fp=document.featurePolicy||document.permissionsPolicy;if(fp&&fp.allowsFeature&&!fp.allowsFeature('microphone'))r.recErr='blocked'}catch(e){}
  const esc=t=>String(t).replace(/[<>&"]/g,'');
  if(R&&!r.recErr&&!r.selfOnly){
    const heard=r.heard?`<p class="heard">I heard: “${esc(r.heard)}” · ${Math.round(r.score*100)}% match</p>${r.score<0.75?'<p class="heard">Listen to the model again and try one more time, or press Verificar.</p>':'<p class="heard">Great pronunciation! Press Verificar.</p>'}`:(r.msg?`<p class="heard">${esc(r.msg)}</p>`:'');
    return `<button class="mic ${r.rec?'on':''}" onclick="speak()" ${r.checked?'disabled':''}>🎤 ${r.rec?'Listening…':(r.heard?'Try again':'Tap and speak')}</button>${heard}<button class="alt" ${r.checked?'disabled':''} onclick="useSelf()">Microphone not working? Use self-check</button>`;
  }
  const note=r.recErr==='not-allowed'||r.recErr==='service-not-allowed'||r.recErr==='blocked'?'The microphone is blocked in this viewer. Open this page directly in Safari or Chrome and allow the microphone.':(r.recErr?'The microphone is not working here.':'Voice recognition is not available here.');
  return `<p class="heard">${note} Say the sentence out loud, then choose:</p><div class="opts"><button class="opt ${r.sp===true?'sel':''}" ${r.checked?'disabled':''} onclick="selfSp(1)">✅ I said it</button><button class="opt ${r.sp===false?'sel':''}" ${r.checked?'disabled':''} onclick="selfSp(0)">🔁 I need more practice</button></div>`;
}
function selfSp(v){run.sp=!!v;draw()}
function useSelf(){run.selfOnly=true;run.sp=null;run.rec=false;draw()}
function speak(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return;
  const r=run,c=r.cur;
  try{
    const rec=new R();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3;
    try{speechSynthesis.cancel()}catch(e){}
    r.rec=true;r.msg='';draw();
    rec.onresult=e=>{
      if(run!==r||r.cur!==c)return;
      const alts=Array.from(e.results[0]).map(a=>a.transcript);
      r.score=Math.max(...alts.map(t=>spScore(t,c.a)));
      r.heard=alts[0];r.sp=r.score>=0.75;r.rec=false;draw();
    };
    rec.onerror=e=>{
      if(run!==r||r.cur!==c)return;
      r.rec=false;
      if(e.error==='no-speech'||e.error==='aborted'){r.msg='I did not hear anything. Tap and try again.'}
      else{r.recErr=e.error||'error'}
      draw();
    };
    rec.onend=()=>{if(run===r&&r.cur===c&&r.rec){r.rec=false;r.msg='I did not hear anything. Tap and try again.';draw()}};
    rec.start();
    setTimeout(()=>{if(run===r&&r.cur===c&&r.rec){r.rec=false;try{rec.stop()}catch(e){}r.msg='We could not hear you. Try again, or use self-check below.';draw()}},9000);
  }catch(err){r.rec=false;r.recErr='error';draw()}
}
function check(){
  const c=run.cur,r=run;
  const ans=c.k==='c'?r.sel:c.k==='t'?r.val:r.built.map(i=>c.w[i]).join(c.l?'':' ').replace(/\s+,/g,',');
  const nz=x=>x.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  r.right=c.k==='s'?!!r.sp:c.k==='t'?c.a.split('|').some(x=>nz(x)===nz(ans)):ans===c.a;if(!r.right&&!c.r){try{const a0=String(c.a).split('|')[0].slice(0,40),ek=key(r.l)+'|'+String(c.p).slice(0,60)+'|'+a0;S.err=S.err||{};const e=S.err[ek]||{n:0,p:String(c.p).slice(0,80),a:a0,l:key(r.l)};e.n++;S.err[ek]=e}catch(x){}}r.checked=true;r.fb=FB[Math.floor(Math.random()*FB.length)];r.q.shift();
  if(r.right){r.done++;if(!c.r){r.xp+=10;r.first++}}else r.q.push({...c,r:1});
  draw();
}
function next(){
  run.sel=null;run.val='';run.built=[];run.checked=false;run.sp=null;run.heard='';run.rec=false;run.recErr='';run.score=0;run.msg='';
  if(!run.q.length)return end();
  run.cur=run.q[0];draw();
}
function draw(){
  const r=run,c=r.cur;
  let body=`<h2>${c.p}</h2>`;
  if(c.e)body+=`<div class="pic" role="img" aria-label="imagem">${c.e}</div>`;
  if(c.say)body+=canSpeak?`<div class="aud"><button class="play" onclick="say(run.cur.say)">🔊 Ouvir</button><button class="play" onclick="say(run.cur.say,1)">🐢 Devagar</button></div>`:(c.k==='s'?'':`<p class="sent">${c.say}</p>`);
  if(c.s){const rd=/^(Leia|Read)/.test(c.p||''),sm=/^Read/.test(c.p||'');body+=rd?`<p class="sent read${sm?' sm':''}">${c.s.replace(/\s+([A-Z][a-z]+:)/g,'\n$1').replace(/^([A-Z][a-z]+:)/gm,'<b>$1</b>')}</p>`:`<p class="sent">${c.s}</p>`}
  if(c.k==='t'){
    body+=`<input id="ty" class="nm ty" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Digite em inglês" aria-label="Sua resposta" value="${r.val.replace(/"/g,'&quot;')}" ${r.checked?'disabled':''} oninput="run.val=this.value;document.querySelector('.cta').disabled=!this.value.trim()">`;
  }else if(c.k==='s'){
    body+=spkUI(r);
  }else if(c.k==='c'){
    body+=`<div class="opts">${c.o.map((o,i)=>`<button class="opt ${r.sel===o?'sel':''} ${r.checked?(o===c.a?'right':(r.sel===o?'wrong':'')):''}" ${r.checked?'disabled':''} onclick="pick(${i})">${o}</button>`).join('')}</div>`;
  }else{
    body+=`<div class="tray" aria-label="Sua resposta">${r.built.map(i=>`<button class="w" ${r.checked?'disabled':''} onclick="unput(${i})">${c.w[i]}</button>`).join('')}</div>
    <div class="bank">${c.w.map((w,i)=>r.built.includes(i)?`<span class="w ghost">${w}</span>`:`<button class="w" ${r.checked?'disabled':''} onclick="put(${i})">${w}</button>`).join('')}</div>`;
  }
  const ready=c.k==='c'?r.sel!==null:c.k==='t'?r.val.trim().length>0:c.k==='s'?r.sp!=null:r.built.length>0;
  const foot=r.checked
    ?`<div class="foot ${r.right?'ok':'bad'}"><div class="in"><div class="msg">${r.right?r.fb:'Almost! Correct answer:<small>'+c.a.split('|')[0]+'</small>'}</div><button class="cta" onclick="next()">Continuar</button></div></div>`
    :`<div class="foot"><div class="in"><button class="cta" ${ready?'':'disabled'} onclick="check()">Verificar</button></div></div>`;
  app.innerHTML=`<div class="bar"><button class="x" onclick="home()" aria-label="Sair da lição">✕</button><div class="track"><div class="fill" style="width:${r.done/r.total*100}%"></div></div></div>${body}`;
  document.querySelector('.foot')?.remove();
  document.body.insertAdjacentHTML('beforeend',foot);
}
function end(){
  const td=new Date().toLocaleDateString('en-CA'),yd=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
  if(S.last!==td){S.streak=S.last===yd?S.streak+1:1;S.last=td}
  S.xp+=run.xp;S.done[key(run.l)]=1;{const k=key(run.l),h=S.hist[k]||{tries:0,best:0};h.tries++;h.best=Math.max(h.best,run.first);h.total=run.total;h.last=td;S.hist[k]=h}save();
  MSG=`Olá, professor(a)! ${S.name?'Aluno(a): '+S.name+'. ':''}${AULAS[cur].nm||'Lesson '+AULAS[cur].n} · ${run.l.t}: ${run.first} de ${run.total} acertos de primeira, +${run.xp} XP. XP total: ${S.xp}. Sequência: ${S.streak} ${S.streak===1?'dia':'dias'}.`;
  document.querySelector('.foot')?.remove();
  app.innerHTML=`<div class="end"><div class="big">🎉</div><h1>Lição concluída!</h1>${unlockMsg()}<p>+${run.xp} XP</p><p>${run.first} de ${run.total} acertos de primeira</p><p>🔥 Sequência: ${S.streak} ${S.streak===1?'dia':'dias'}</p>
  <a class="cta share" href="https://wa.me/${PHONE}?text=${encodeURIComponent(MSG)}" target="_blank" rel="noopener">Enviar resultado no WhatsApp</a>
  <button class="alt" id="cp" onclick="copyMsg()">Copiar resumo</button>
  <p class="msgbox">${MSG}</p></div>
  <div class="foot"><div class="in"><button class="cta" onclick="home()">Voltar às lições</button></div></div>`;
}
function code(){try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return ''}}
function copyCode(){const b=document.getElementById('cp2'),t=document.getElementById('cd');t.select();try{navigator.clipboard.writeText(t.value).then(()=>{b.textContent='Copiado!'},()=>{b.textContent='Selecione e copie o código acima'})}catch(e){b.textContent='Selecione e copie o código acima'}}
function restore(){const m=document.getElementById('rm');try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('rs').value.trim()))));if(!o||typeof o.xp!=='number'||typeof o.done!=='object')throw 0;S=Object.assign({xp:0,done:{},hist:{},streak:0,last:'',name:'',t:0},o);save();prog();document.getElementById('rm').textContent='Progresso restaurado!'}catch(e){m.textContent='Código inválido. Cole o código completo.'}}

const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy=d=>d?String(d).split('-').reverse().join('/'):'-';
const LN=k=>{const [n,id]=k.split('.');const a=AULAS.find(x=>String(x.n)===n);const l=a&&a.L.find(x=>String(x.id)===id);return a?(a.nm||'Lesson '+a.n)+(l?' - '+l.t:''):k};
const OK=new Set(AULAS.flatMap(a=>a.L.map(l=>a.n+'.'+l.id)));
let ST=[];
async function dash(){
  run=null;scr='dash';document.querySelector('.foot')?.remove();
  const bar='<div class="bar"><button class="x" onclick="home()" aria-label="Voltar">\u2715</button><h1>Painel do professor</h1></div>';
  app.innerHTML=bar+'<p class="lead">Carregando...</p>';
  try{
    const snap=await DB.collection('students').get();
    const raw=snap.docs.map(d=>d.data());
    const ps=raw.length?await U.profiles(raw.map(r=>r.uid)):{};
    ST=raw.map(r=>{const p=ps[r.uid]||{};return {...r,nm:p.name||'Aluno '+String(r.uid).slice(0,4),em:p.email||'',nd:Object.keys(r.done||{}).filter(k=>OK.has(k)).length}}).sort((a,b)=>(b.t||0)-(a.t||0));
  }catch(e){app.innerHTML=bar+'<p class="warn">Nao foi possivel carregar os alunos agora. Tente de novo.</p>';return}
  const er={};ST.forEach(s=>Object.entries(s.err||{}).forEach(([k,v])=>{const o=er[k]||(er[k]={...v,n:0,s:0});o.n+=v.n;o.s++}));
  const top=Object.values(er).sort((a,b)=>b.n-a.n).slice(0,10);
  app.innerHTML=bar+`<p class="lead">${ST.length} ${ST.length===1?'aluno':'alunos'} com progresso salvo</p>
  ${ST.map(s=>`<details class="row" style="display:block"><summary style="cursor:pointer"><b>${esc(s.nm)}</b> <small>${esc(s.em)}</small><br><small>${s.nd} de ${TOTAL} licoes - ${s.xp||0} XP - sequencia ${s.streak||0} - ultima atividade ${dmy(s.last)}</small></summary>
  ${Object.entries(s.hist||{}).filter(([k])=>OK.has(k)).map(([k,h])=>`<p class="hint" style="margin:6px 0">${esc(LN(k))}: ${h.best}/${h.total} de primeira - ${h.tries} ${h.tries===1?'tentativa':'tentativas'} - ${dmy(h.last)}</p>`).join('')||'<p class="hint">Nenhuma licao feita ainda.</p>'}</details>`).join('')||'<p class="lead">Nenhum aluno abriu o app ainda.</p>'}
  <h2>Perguntas que mais erram</h2>
  ${top.map(o=>`<div class="row" style="display:block"><b>${esc(o.p)}</b><br><small>Resposta: ${esc(o.a)} - ${esc(LN(o.l))} - ${o.n} ${o.n===1?'erro':'erros'} (${o.s} ${o.s===1?'aluno':'alunos'})</small></div>`).join('')||'<p class="lead">Sem erros registrados ainda.</p>'}
  ${DL?'<button class="alt" onclick="csv()">Baixar CSV</button>':''}
  <p id="dm" class="lead"></p>`;
}
function csv(){
  const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
  const rows=[['aluno','email','xp','sequencia','licao','tentativas','acertos_primeira','total','ultima']];
  ST.forEach(s=>{const hs=Object.entries(s.hist||{}).filter(([k])=>OK.has(k));if(!hs.length)rows.push([s.nm,s.em,s.xp||0,s.streak||0,'','','','','']);hs.forEach(([k,h])=>rows.push([s.nm,s.em,s.xp||0,s.streak||0,LN(k),h.tries,h.best,h.total,h.last]))});
  DL.save({filename:'progresso-alunos.csv',data:'\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n')}).catch(()=>{const m=document.getElementById('dm');if(m)m.textContent='Download nao concluido.'});
}
function prog(){
  run=null;scr='prog';
  const rows=AULAS.flatMap(a=>a.L.map(l=>{const h=S.hist[a.n+'.'+l.id];return `<div class="row"><span><b>${a.nm||'Lesson '+a.n} · ${l.t}</b><small>${h?h.tries+(h.tries===1?' tentativa':' tentativas')+' · última em '+h.last.split('-').reverse().join('/'):'Ainda não feita'}</small></span><span class="${h?'ok2':''}">${h?'✓ '+h.best+'/'+h.total:'—'}</span></div>`}));
  const n=Object.keys(S.hist).length;
  const txt=`Olá, professor(a)! ${S.name?'Aluno(a): '+S.name+'. ':''}Lições feitas: ${n} de ${rows.length}. XP total: ${S.xp}. Sequência: ${S.streak} ${S.streak===1?'dia':'dias'}.`+AULAS.flatMap(a=>a.L.map(l=>{const h=S.hist[a.n+'.'+l.id];return h?` ${a.nm||'Lesson '+a.n} · ${l.t}: ${h.best}/${h.total}.`:''})).join('');
  app.innerHTML=`<div class="bar"><button class="x" onclick="home()" aria-label="Voltar">←</button><h1>Meu progresso</h1></div>
  <p class="lead">${n} de ${rows.length} lições feitas · ⭐ ${S.xp} XP · 🔥 ${S.streak}</p>
  ${rows.join('')}
  <a class="cta share" href="https://wa.me/${PHONE}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Enviar progresso no WhatsApp</a>
  <h2>Backup do progresso</h2>
  <p class="lead">Se o progresso sumir, cole o código abaixo para recuperar.</p>
  <textarea id="cd" class="code" readonly aria-label="Código de backup">${code()}</textarea>
  <button class="alt" id="cp2" onclick="copyCode()">Copiar código</button>
  <textarea id="rs" class="code" placeholder="Cole aqui um código salvo" aria-label="Colar código"></textarea>
  <button class="alt" onclick="restore()">Restaurar progresso</button>
  <p id="rm" class="lead"></p>`;
  document.querySelector('.foot')?.remove();
}
{let k=0;AULAS.forEach((a,i)=>{if(aulaOpen(i)&&!a.href)k=i});cur=k;L=AULAS[k].L}
home();
(async()=>{try{
  if(typeof claude==='undefined'||!claude.use)return;
  const [db,u]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!u)return;
  const id=await u.id();
  if(!id)return;
  const ref=db.collection('data/users/'+id).doc('progress');
  const snap=await ref.get();
  const r=snap.exists?snap.data():null;
  if(r&&(r.t||0)>(S.t||0)){S=Object.assign({xp:0,done:{},hist:{},streak:0,last:'',name:'',t:0},JSON.parse(JSON.stringify(r)));try{localStorage.setItem('tobeA1',JSON.stringify(S))}catch(e){}}
  remote=ref;DB=db;U=u;
  try{isT=!!(await u.isOwner())||!!(await u.canEdit())}catch(e){}
  try{DL=await claude.use('downloads')}catch(e){}
  if(!isT){PID=id;pub=db.collection('students').doc(id)}
  if(!run){scr==='prog'?prog():home()}
  if(pub||!r||(r.t||0)<(S.t||0))save();
}catch(e){}})();
</script>
</body>
